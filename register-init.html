<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aktivasi Akun Guru - Schoolhub Central</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        indigo: {
                            50: '#f0f4ff',
                            100: '#e0e9ff',
                            200: '#c2d3ff',
                            300: '#a3bdff',
                            400: '#85a7ff',
                            500: '#6691ff',
                            600: '#4f46e5',
                            700: '#3730a3',
                            800: '#1e1b4b',
                            900: '#0f172a',
                        },
                    },
                    borderRadius: {
                        '4xl': '2rem',
                    }
                }
            }
        }
    </script>
    <script>
        if (localStorage.getItem("color-theme") === "dark" || (!("color-theme" in localStorage) && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
            document.documentElement.classList.add("dark");
        } else {
            document.documentElement.classList.remove("dark")
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { font-family: "Plus Jakarta Sans", sans-serif; letter-spacing: -0.01em; }
        .glass-card { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.3); }
        .dark .glass-card { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="bg-[#F8FAFC] dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen flex items-center justify-center p-6 pb-12">
    
    <div class="w-full max-w-sm relative">
        <div class="text-center mb-10">
            <h1 class="text-3xl font-black italic uppercase tracking-tighter dark:text-white leading-none">Aktivasi Akun.</h1>
            <p class="text-[10px] text-indigo-600 dark:text-indigo-400 font-black uppercase tracking-[0.3em] mt-2 italic">Registrasi Sistem Akademik</p>
        </div>

        <div class="glass-card rounded-[3rem] p-8 shadow-2xl relative z-10">
            <form action="create-pin.html" class="space-y-6">
                <div class="space-y-4">
                    <label class="block text-[10px] font-black uppercase tracking-[0.2em] text-slate-400 ml-1 italic text-center">Nomor Induk Pegawai (NIP)</label>
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-5 flex items-center pointer-events-none">
                            <i class="bi bi-card-text text-slate-400 group-focus-within:text-indigo-600 transition-colors"></i>
                        </div>
                        <input type="text" class="w-full bg-slate-50 dark:bg-slate-950 dark:text-white border-none rounded-2xl pl-12 pr-6 py-5 text-xl font-black tracking-[0.3em] focus:ring-2 focus:ring-indigo-600 outline-none transition-all shadow-sm text-center" placeholder="19XXXXXXXXX">
                    </div>
                </div>
                
                <button type="submit" class="w-full py-5 bg-indigo-600 text-white rounded-2xl text-[10px] font-black uppercase tracking-[0.2em] shadow-xl shadow-indigo-500/30 active:scale-95 transition-all flex items-center justify-center gap-2 italic">
                    Cek Validasi Data <i class="bi bi-search"></i>
                </button>
            </form>

            <div class="mt-8 pt-6 border-t border-slate-100 dark:border-slate-800 text-center">
                <a href="login.html" class="text-[10px] font-black uppercase tracking-widest text-slate-400 hover:text-indigo-600 transition-colors italic">Kembali ke Login</a>
            </div>
        </div>

        <!-- Info Card -->
        <div class="mt-8 p-6 bg-indigo-600/5 dark:bg-indigo-500/5 rounded-[2rem] border border-indigo-100 dark:border-indigo-900/30">
            <div class="flex items-start gap-4">
                <div class="w-10 h-10 bg-white dark:bg-slate-900 rounded-2xl flex items-center justify-center text-indigo-600 shadow-sm shrink-0">
                    <i class="bi bi-info-circle-fill"></i>
                </div>
                <div>
                    <h4 class="text-[10px] font-black uppercase tracking-widest text-indigo-600 mb-1">Penting</h4>
                    <p class="text-[10px] leading-relaxed font-medium text-slate-500 dark:text-slate-400">Pastikan NIP anda sudah didaftarkan oleh Operator Sekolah di Portal Admin sebelum melakukan aktivasi mandiri.</p>
                </div>
            </div>
        </div>

        <p class="mt-10 text-center text-[9px] font-black text-slate-300 uppercase tracking-[0.4em]">Schoolhub Central v4.0</p>
    </div>

</body>
</html>
