<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Akses Cepat Guru - Schoolhub Central</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        indigo: {
                            50: '#f0f4ff',
                            100: '#e0e9ff',
                            200: '#c2d3ff',
                            300: '#a3bdff',
                            400: '#85a7ff',
                            500: '#6691ff',
                            600: '#4f46e5',
                            700: '#3730a3',
                            800: '#1e1b4b',
                            900: '#0f172a',
                        },
                    },
                    borderRadius: {
                        '4xl': '2rem',
                    }
                }
            }
        }
    </script>
    <script>
        if (localStorage.getItem("color-theme") === "dark" || (!("color-theme" in localStorage) && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
            document.documentElement.classList.add("dark");
        } else {
            document.documentElement.classList.remove("dark")
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { font-family: "Plus Jakarta Sans", sans-serif; letter-spacing: -0.01em; }
        .glass-card { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.3); }
        .dark .glass-card { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="bg-[#F8FAFC] dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen flex items-center justify-center p-6 pb-12">
    
    <div class="w-full max-w-sm relative">
        <div class="text-center mb-10">
            <h1 class="text-3xl font-black italic uppercase tracking-tighter dark:text-white leading-none">Pahlawan Bangsa.</h1>
            <p class="text-[10px] text-indigo-600 dark:text-indigo-400 font-black uppercase tracking-[0.3em] mt-2 italic">Akses Cepat Panel Guru</p>
        </div>

        <div class="glass-card rounded-[3.5rem] p-8 shadow-2xl relative z-10 overflow-hidden">
            <!-- Profile Info -->
            <div class="text-center mb-10">
                <div class="w-24 h-24 mx-auto bg-white dark:bg-slate-800 rounded-[2.5rem] flex items-center justify-center mb-5 p-1 shadow-xl relative group">
                    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Teacher&backgroundColor=b6e3f4" alt="Avatar" class="w-full h-full object-cover rounded-[2.2rem]">
                    <div class="absolute -bottom-1 -right-1 w-8 h-8 bg-green-500 border-4 border-white dark:border-slate-900 rounded-full"></div>
                </div>
                <h3 class="text-xl font-bold dark:text-white">Bpk. Hermawan</h3>
                <p class="text-[10px] font-black uppercase tracking-widest text-slate-400 mt-1">Guru Matematika • 12A</p>
            </div>

            <form action="index.html" class="space-y-6">
                <div class="space-y-4">
                    <label class="block text-center text-[10px] font-black uppercase tracking-[0.2em] text-slate-400 italic">Verifikasi PIN Keamanan</label>
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-5 flex items-center pointer-events-none">
                            <i class="bi bi-shield-lock-fill text-slate-400 group-focus-within:text-indigo-600 transition-colors"></i>
                        </div>
                        <input type="password" class="w-full bg-slate-50 dark:bg-slate-950 dark:text-white border-none rounded-2xl pl-12 pr-6 py-5 text-xl font-black tracking-[0.5em] focus:ring-2 focus:ring-indigo-600 outline-none transition-all shadow-sm text-center" placeholder="••••">
                    </div>
                </div>
                
                <button type="submit" class="w-full py-5 bg-indigo-600 text-white rounded-2xl text-[10px] font-black uppercase tracking-[0.2em] shadow-xl shadow-indigo-500/30 active:scale-95 transition-all flex items-center justify-center gap-2 italic">
                    Buka Panel Guru <i class="bi bi-arrow-right"></i>
                </button>
            </form>

            <div class="mt-8 pt-8 border-t border-slate-100 dark:border-slate-800 flex flex-col gap-4 items-center">
                <button class="inline-flex items-center gap-2 text-[10px] font-black uppercase tracking-widest text-indigo-600 dark:text-indigo-400 italic hover:opacity-70 transition-all">
                    <i class="bi bi-fingerprint text-lg"></i>
                    Gunakan Biometrik
                </button>
                <a href="login.html" class="text-[9px] font-bold text-slate-400 hover:text-indigo-600 transition-colors">Bukan saya? Keluar Akun</a>
            </div>
        </div>

        <p class="mt-10 text-center text-[9px] font-black text-slate-300 uppercase tracking-[0.4em]">Schoolhub Central v4.0</p>
    </div>

</body>
</html>
