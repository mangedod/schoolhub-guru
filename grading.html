<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Input Nilai Siswa - Schoolhub Central</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        indigo: {
                            50: '#f0f4ff',
                            100: '#e0e9ff',
                            200: '#c2d3ff',
                            300: '#a3bdff',
                            400: '#85a7ff',
                            500: '#6691ff',
                            600: '#4f46e5',
                            700: '#3730a3',
                            800: '#1e1b4b',
                            900: '#0f172a',
                        },
                    },
                    borderRadius: {
                        '4xl': '2rem',
                    }
                }
            }
        }
    </script>
    <script>
        if (localStorage.getItem("color-theme") === "dark" || (!("color-theme" in localStorage) && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
            document.documentElement.classList.add("dark");
        } else {
            document.documentElement.classList.remove("dark")
        }
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        [x-cloak] { display: none !important; }
        body { font-family: "Plus Jakarta Sans", sans-serif; letter-spacing: -0.01em; }
        .glass-card { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.3); }
        .dark .glass-card { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-[#F8FAFC] dark:bg-slate-950 text-slate-900 dark:text-slate-100 pb-32">

    <!-- Sticky Header -->
    <header class="fixed top-0 left-0 right-0 z-50 bg-white/80 dark:bg-slate-900/80 backdrop-blur-lg border-b border-slate-200 dark:border-slate-800 px-6 py-4">
        <div class="flex items-center justify-between mb-4">
            <div class="flex items-center gap-4">
                <a href="index.html" class="w-10 h-10 glass-card rounded-2xl flex items-center justify-center text-slate-600 dark:text-slate-400">
                    <i class="bi bi-arrow-left"></i>
                </a>
                <h1 class="text-lg font-black text-slate-900 dark:text-white tracking-tight italic uppercase">Input Nilai</h1>
            </div>
            <button class="w-10 h-10 glass-card rounded-2xl flex items-center justify-center text-indigo-600 shadow-sm">
                <i class="bi bi-funnel"></i>
            </button>
        </div>

        <!-- Horizontal Context Chips -->
        <div class="flex gap-2 overflow-x-auto no-scrollbar pb-1">
            <div class="px-4 py-2 bg-indigo-50 dark:bg-indigo-900/20 border border-indigo-100 dark:border-indigo-800 rounded-xl flex-shrink-0">
                <p class="text-[8px] font-black text-indigo-400 uppercase tracking-[0.2em] mb-0.5">Mata Pelajaran</p>
                <p class="text-xs font-bold text-indigo-900 dark:text-indigo-200">Matematika</p>
            </div>
            <div class="px-4 py-2 bg-emerald-50 dark:bg-emerald-900/20 border border-emerald-100 dark:border-emerald-800 rounded-xl flex-shrink-0">
                <p class="text-[8px] font-black text-emerald-400 uppercase tracking-[0.2em] mb-0.5">Penilaian</p>
                <p class="text-xs font-bold text-emerald-900 dark:text-emerald-200 uppercase tracking-tighter">Ulangan Harian 2</p>
            </div>
            <div class="px-4 py-2 bg-amber-50 dark:bg-amber-900/20 border border-amber-100 dark:border-amber-800 rounded-xl flex-shrink-0">
                <p class="text-[8px] font-black text-amber-400 uppercase tracking-[0.2em] mb-0.5">Kelas</p>
                <p class="text-xs font-bold text-amber-900 dark:text-amber-200">XI-IPA-2</p>
            </div>
        </div>
    </header>

    <main class="pt-44 px-6">
        <!-- Search -->
        <div class="relative mb-6">
            <i class="bi bi-search absolute left-5 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input type="text" placeholder="Cari nama siswa..." 
                   class="w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl pl-12 pr-4 py-4 text-sm font-semibold focus:outline-none focus:border-indigo-500 transition-all shadow-sm">
        </div>

        <!-- Student Attendance List -->
        <div class="space-y-4">
            <!-- Row 1 -->
            <div class="bg-white dark:bg-slate-900 p-4 rounded-3xl border border-slate-100 dark:border-slate-800 flex items-center justify-between shadow-sm group">
                <div class="flex items-center gap-4">
                    <div class="relative">
                        <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Aditya" class="w-12 h-12 rounded-2xl bg-slate-50 dark:bg-slate-800 border border-slate-100 dark:border-slate-700" alt="Student">
                    </div>
                    <div>
                        <h4 class="text-sm font-black text-slate-800 dark:text-white uppercase tracking-tight">Aditya Pratama</h4>
                        <p class="text-[10px] text-slate-400 font-bold tracking-widest uppercase">NIS: 12059384</p>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <input type="number" value="88" placeholder="0" 
                           class="w-14 h-14 bg-slate-50 dark:bg-slate-800 border-2 border-transparent focus:border-indigo-500 dark:focus:border-indigo-500 rounded-2xl text-center text-lg font-black text-indigo-600 dark:text-indigo-400 outline-none transition-all">
                    <button class="w-10 h-10 flex items-center justify-center text-slate-300 dark:text-slate-600 group-hover:text-amber-500 transition-colors">
                        <i class="bi bi-chat-dots-fill"></i>
                    </button>
                </div>
            </div>

            <!-- Row 2 -->
            <div class="bg-white dark:bg-slate-900 p-4 rounded-3xl border border-slate-100 dark:border-slate-800 flex items-center justify-between shadow-sm group">
                <div class="flex items-center gap-4">
                    <div class="relative">
                        <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Budi" class="w-12 h-12 rounded-2xl bg-slate-50 dark:bg-slate-800 border border-slate-100 dark:border-slate-700" alt="Student">
                    </div>
                    <div>
                        <h4 class="text-sm font-black text-slate-800 dark:text-white uppercase tracking-tight">Budi Sudono</h4>
                        <p class="text-[10px] text-slate-400 font-bold tracking-widest uppercase">NIS: 12059385</p>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <input type="number" value="75" placeholder="0" 
                           class="w-14 h-14 bg-slate-50 dark:bg-slate-800 border-2 border-transparent focus:border-indigo-500 dark:focus:border-indigo-500 rounded-2xl text-center text-lg font-black text-indigo-600 dark:text-indigo-400 outline-none transition-all">
                    <button class="w-10 h-10 flex items-center justify-center text-indigo-600 dark:text-indigo-400">
                        <i class="bi bi-chat-left-dots-fill"></i>
                    </button>
                </div>
            </div>

            <!-- Row 3 -->
            <div class="bg-white dark:bg-slate-900 p-4 rounded-3xl border border-slate-100 dark:border-slate-800 flex items-center justify-between shadow-sm group">
                <div class="flex items-center gap-4">
                    <div class="relative">
                        <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Citra" class="w-12 h-12 rounded-2xl bg-slate-50 dark:bg-slate-800 border border-slate-100 dark:border-slate-700" alt="Student">
                    </div>
                    <div>
                        <h4 class="text-sm font-black text-slate-800 dark:text-white uppercase tracking-tight">Citra Kirana</h4>
                        <p class="text-[10px] text-slate-400 font-bold tracking-widest uppercase">NIS: 12059386</p>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <input type="number" placeholder="--" 
                           class="w-14 h-14 bg-slate-50 dark:bg-slate-800 border-2 border-dashed border-slate-200 dark:border-slate-700 focus:border-indigo-500 focus:border-solid rounded-2xl text-center text-lg font-black text-slate-400 outline-none transition-all">
                    <button class="w-10 h-10 flex items-center justify-center text-slate-300 dark:text-slate-600">
                        <i class="bi bi-chat-dots"></i>
                    </button>
                </div>
            </div>

            <!-- Row 4 -->
            <div class="bg-rose-50/50 dark:bg-rose-900/10 p-4 rounded-3xl border border-rose-100 dark:border-rose-900/30 flex items-center justify-between shadow-sm group">
                <div class="flex items-center gap-4">
                    <div class="relative">
                        <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Deni" class="w-12 h-12 rounded-2xl bg-white dark:bg-slate-800 border border-rose-200 dark:border-rose-900/50" alt="Student">
                    </div>
                    <div>
                        <h4 class="text-sm font-black text-slate-800 dark:text-white uppercase tracking-tight">Deni Ramadhan</h4>
                        <p class="text-[10px] text-rose-500 font-bold tracking-widest uppercase italic">Izin Sakit</p>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <div class="w-14 h-14 bg-white/50 dark:bg-slate-800/50 rounded-2xl flex items-center justify-center text-rose-500 font-bold text-xs uppercase tracking-widest italic">Sakit</div>
                    <button class="w-10 h-10 flex items-center justify-center text-rose-400">
                        <i class="bi bi-file-earmark-medical"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Footer Note -->
        <div class="mt-10 text-center">
            <p class="text-[9px] font-black text-slate-400 uppercase tracking-[0.4em] italic leading-relaxed">
                Platform Terintegrasi E-Rapor Pusat
            </p>
        </div>
    </main>

    <!-- Dynamic Footer Action -->
    <div class="fixed bottom-0 left-0 right-0 z-[100] px-6 pb-8 pt-4 bg-gradient-to-t from-[#F8FAFC] via-[#F8FAFC] to-transparent dark:from-slate-950 dark:via-slate-950">
        <div class="glass-card rounded-[2.5rem] p-4 flex items-center gap-4 shadow-2xl shadow-indigo-500/10">
            <div class="flex-1 pl-2">
                <div class="flex justify-between items-center mb-1.5">
                    <span class="text-[9px] font-black text-slate-400 uppercase tracking-widest">Progress Nilai</span>
                    <span class="text-[9px] font-black text-indigo-600 dark:text-indigo-400 uppercase tracking-widest">12/32 Siswa</span>
                </div>
                <div class="w-full h-1.5 bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden">
                    <div class="w-1/3 h-full bg-indigo-600 rounded-full shadow-[0_0_10px_rgba(79,70,229,0.5)]"></div>
                </div>
            </div>
            <button class="bg-indigo-600 text-white px-8 py-4 rounded-[1.5rem] text-[10px] font-black uppercase tracking-[0.2em] shadow-xl shadow-indigo-500/30 active:scale-95 transition-all">
                Simpan
            </button>
        </div>
    </div>

</body>
</html>
