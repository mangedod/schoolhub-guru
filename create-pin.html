<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Buat PIN Guru - Schoolhub Central</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        indigo: {
                            50: '#f0f4ff',
                            100: '#e0e9ff',
                            200: '#c2d3ff',
                            300: '#a3bdff',
                            400: '#85a7ff',
                            500: '#6691ff',
                            600: '#4f46e5',
                            700: '#3730a3',
                            800: '#1e1b4b',
                            900: '#0f172a',
                        },
                    },
                    borderRadius: {
                        '4xl': '2rem',
                    }
                }
            }
        }
    </script>
    <script>
        if (localStorage.getItem("color-theme") === "dark" || (!("color-theme" in localStorage) && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
            document.documentElement.classList.add("dark");
        } else {
            document.documentElement.classList.remove("dark")
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { font-family: "Plus Jakarta Sans", sans-serif; letter-spacing: -0.01em; }
        .glass-card { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.3); }
        .dark .glass-card { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="bg-[#F8FAFC] dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen flex items-center justify-center p-6 pb-12">
    
    <div class="w-full max-w-sm relative">
        <div class="text-center mb-10">
            <h1 class="text-3xl font-black italic uppercase tracking-tighter dark:text-white leading-none">Keamanan PIN.</h1>
            <p class="text-[10px] text-indigo-600 dark:text-indigo-400 font-black uppercase tracking-[0.3em] mt-2 italic px-8">Ahmad Sulaiman, S.Pd</p>
        </div>

        <div class="glass-card rounded-[3.5rem] p-8 shadow-2xl relative z-10">
            <form action="login.html" class="space-y-8">
                <div class="text-center space-y-4">
                    <label class="block text-[10px] font-black uppercase tracking-[0.2em] text-slate-400 italic">Tentukan 6 Digit PIN Anda</label>
                    <div class="flex justify-between gap-2 px-2">
                        <input type="password" maxlength="1" class="pin-input w-10 h-14 text-2xl font-black text-center bg-slate-50 dark:bg-slate-900 dark:text-white rounded-[1.2rem] border-none focus:ring-2 focus:ring-indigo-600 outline-none transition-all shadow-sm">
                        <input type="password" maxlength="1" class="pin-input w-10 h-14 text-2xl font-black text-center bg-slate-50 dark:bg-slate-900 dark:text-white rounded-[1.2rem] border-none focus:ring-2 focus:ring-indigo-600 outline-none transition-all shadow-sm">
                        <input type="password" maxlength="1" class="pin-input w-10 h-14 text-2xl font-black text-center bg-slate-50 dark:bg-slate-900 dark:text-white rounded-[1.2rem] border-none focus:ring-2 focus:ring-indigo-600 outline-none transition-all shadow-sm">
                        <input type="password" maxlength="1" class="pin-input w-10 h-14 text-2xl font-black text-center bg-slate-50 dark:bg-slate-900 dark:text-white rounded-[1.2rem] border-none focus:ring-2 focus:ring-indigo-600 outline-none transition-all shadow-sm">
                        <input type="password" maxlength="1" class="pin-input w-10 h-14 text-2xl font-black text-center bg-slate-50 dark:bg-slate-900 dark:text-white rounded-[1.2rem] border-none focus:ring-2 focus:ring-indigo-600 outline-none transition-all shadow-sm">
                        <input type="password" maxlength="1" class="pin-input w-10 h-14 text-2xl font-black text-center bg-slate-50 dark:bg-slate-900 dark:text-white rounded-[1.2rem] border-none focus:ring-2 focus:ring-indigo-600 outline-none transition-all shadow-sm">
                    </div>
                </div>

                <div class="space-y-4 pt-4">
                    <button type="submit" class="w-full py-5 bg-indigo-600 text-white rounded-2xl text-[10px] font-black uppercase tracking-[0.2em] shadow-xl shadow-indigo-500/30 active:scale-95 transition-all flex items-center justify-center gap-2 italic">
                        Setel PIN & Selesai <i class="bi bi-check-circle-fill"></i>
                    </button>
                    <div class="bg-indigo-600/5 dark:bg-indigo-500/5 rounded-2xl p-4 border border-indigo-100/50 dark:border-indigo-900/30 border-dashed">
                        <p class="text-[9px] text-slate-400 text-center leading-relaxed font-medium">PIN ini bersifat rahasia dan akan digunakan untuk otentikasi login serta verifikasi nilai raport.</p>
                    </div>
                </div>
            </form>
        </div>

        <p class="mt-10 text-center text-[9px] font-black text-slate-300 uppercase tracking-[0.4em]">Schoolhub Central v4.0</p>
    </div>

    <script>
        const inputs = document.querySelectorAll('.pin-input');
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });
    </script>
</body>
</html>
