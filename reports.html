<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>E-Rapor Guru - Schoolhub Central</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        indigo: {
                            50: '#f0f4ff',
                            100: '#e0e9ff',
                            200: '#c2d3ff',
                            300: '#a3bdff',
                            400: '#85a7ff',
                            500: '#6691ff',
                            600: '#4f46e5',
                            700: '#3730a3',
                            800: '#1e1b4b',
                            900: '#0f172a',
                        },
                    },
                    borderRadius: {
                        '4xl': '2rem',
                    }
                }
            }
        }
    </script>
    <script>
        if (localStorage.getItem("color-theme") === "dark" || (!("color-theme" in localStorage) && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
            document.documentElement.classList.add("dark");
        } else {
            document.documentElement.classList.remove("dark")
        }
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        [x-cloak] { display: none !important; }
        body { font-family: "Plus Jakarta Sans", sans-serif; letter-spacing: -0.01em; }
        .glass-card { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.3); }
        .dark .glass-card { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-[#F8FAFC] dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen pb-40">

    <!-- Top Header & Summary -->
    <header class="bg-white/80 dark:bg-slate-900/80 backdrop-blur-lg border-b border-slate-200 dark:border-slate-800 sticky top-0 z-50">
        <div class="px-6 py-6 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <a href="index.html" class="w-10 h-10 glass-card rounded-2xl flex items-center justify-center text-slate-600 dark:text-slate-400">
                    <i class="bi bi-arrow-left"></i>
                </a>
                <div>
                    <h1 class="text-sm font-black text-slate-900 dark:text-white uppercase tracking-tight">E-Rapor Digital</h1>
                    <p class="text-[10px] text-indigo-600 dark:text-indigo-400 font-black uppercase tracking-[0.2em] italic">Ganjil 2025/2026</p>
                </div>
            </div>
            <button class="w-10 h-10 glass-card rounded-2xl flex items-center justify-center text-indigo-600 dark:text-indigo-400">
                <i class="bi bi-cloud-arrow-down-fill"></i>
            </button>
        </div>

        <!-- Quick Stats Bento -->
        <div class="px-6 pb-6">
            <div class="grid grid-cols-3 gap-3">
                <div class="bg-slate-50 dark:bg-slate-800/50 p-3 rounded-2xl text-center border border-slate-100 dark:border-slate-800">
                    <p class="text-[8px] font-black text-slate-400 uppercase tracking-widest mb-1">Draf</p>
                    <p class="text-xs font-black text-slate-700 dark:text-white">12</p>
                </div>
                <div class="bg-amber-50 dark:bg-amber-900/20 p-3 rounded-2xl text-center border border-amber-100/50 dark:border-amber-900/30">
                    <p class="text-[8px] font-black text-amber-600 uppercase tracking-widest mb-1">Review</p>
                    <p class="text-xs font-black text-amber-700 dark:text-amber-500">15</p>
                </div>
                <div class="bg-emerald-50 dark:bg-emerald-900/20 p-3 rounded-2xl text-center border border-emerald-100/50 dark:border-emerald-900/30">
                    <p class="text-[8px] font-black text-emerald-600 uppercase tracking-widest mb-1">Publish</p>
                    <p class="text-xs font-black text-emerald-700 dark:text-emerald-500">5</p>
                </div>
            </div>
        </div>
    </header>

    <main class="px-6 pt-8" x-data="{ filter: 'all' }">
        <!-- Filter Tabs -->
        <div class="flex gap-2 mb-8 overflow-x-auto no-scrollbar">
            <button @click="filter = 'all'" :class="filter === 'all' ? 'bg-indigo-600 text-white' : 'bg-white dark:bg-slate-900 text-slate-400 border-slate-100 dark:border-slate-800'"
                    class="px-6 py-2.5 rounded-full text-[9px] font-black uppercase tracking-widest border shadow-sm transition-all whitespace-nowrap">Semua Siswa</button>
            <button @click="filter = 'pending'" :class="filter === 'pending' ? 'bg-indigo-600 text-white' : 'bg-white dark:bg-slate-900 text-slate-400 border-slate-100 dark:border-slate-800'"
                    class="px-6 py-2.5 rounded-full text-[9px] font-black uppercase tracking-widest border shadow-sm transition-all whitespace-nowrap">Belum Selesai</button>
            <button @click="filter = 'ready'" :class="filter === 'ready' ? 'bg-indigo-600 text-white' : 'bg-white dark:bg-slate-900 text-slate-400 border-slate-100 dark:border-slate-800'"
                    class="px-6 py-2.5 rounded-full text-[9px] font-black uppercase tracking-widest border shadow-sm transition-all whitespace-nowrap">Siap Terbit</button>
        </div>

        <!-- Student List -->
        <div class="space-y-4">
            <!-- Student 1 -->
            <div class="bg-white dark:bg-slate-900 p-6 rounded-[2.5rem] border border-slate-100 dark:border-slate-800 shadow-sm transition-all active:scale-[0.98]">
                <div class="flex items-center justify-between mb-6">
                    <div class="flex items-center gap-4">
                        <div class="w-14 h-14 bg-indigo-50 dark:bg-slate-800 rounded-2xl flex items-center justify-center overflow-hidden border border-indigo-100 dark:border-slate-700 shadow-sm shadow-indigo-100/50">
                            <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Aditya" alt="">
                        </div>
                        <div>
                            <h3 class="text-sm font-black text-slate-800 dark:text-white uppercase tracking-tight">Aditya Pratama</h3>
                            <p class="text-[9px] text-indigo-600 dark:text-indigo-400 font-bold tracking-widest uppercase italic">XI IPA 2 • 0098221</p>
                        </div>
                    </div>
                </div>
                
                <div class="grid grid-cols-2 gap-4 mb-6">
                    <div class="bg-slate-50 dark:bg-slate-800/40 p-4 rounded-3xl border border-slate-100 dark:border-slate-800/50">
                        <p class="text-[8px] font-black text-slate-400 uppercase tracking-widest mb-1">Absensi</p>
                        <div class="flex items-baseline gap-1">
                            <span class="text-xs font-black text-slate-700 dark:text-white italic">95.4%</span>
                            <span class="text-[8px] font-bold text-emerald-500 uppercase tracking-tighter">Excellent</span>
                        </div>
                    </div>
                    <div class="bg-slate-50 dark:bg-slate-800/40 p-4 rounded-3xl border border-slate-100 dark:border-slate-800/50">
                        <p class="text-[8px] font-black text-slate-400 uppercase tracking-widest mb-1">Rata-rata Nilai</p>
                        <div class="flex items-baseline gap-1">
                            <span class="text-xs font-black text-slate-700 dark:text-white italic">82.4</span>
                            <i class="bi bi-caret-up-fill text-[8px] text-emerald-500"></i>
                        </div>
                    </div>
                </div>

                <div class="flex gap-3">
                    <button class="flex-1 bg-indigo-600 text-white text-[10px] font-black uppercase tracking-[0.2em] py-4 rounded-2xl shadow-lg shadow-indigo-500/20 active:scale-95 transition-all">Review & Terbitkan</button>
                    <button class="w-14 bg-slate-100 dark:bg-slate-800 text-slate-400 rounded-2xl flex items-center justify-center active:scale-95 transition-all">
                        <i class="bi bi-eye-fill"></i>
                    </button>
                </div>
            </div>

            <!-- Student 2 (Published) -->
            <div class="bg-white dark:bg-slate-900 p-6 rounded-[2.5rem] border border-slate-100 dark:border-slate-800 shadow-sm transition-all opacity-80">
                <div class="flex items-center justify-between mb-2">
                    <div class="flex items-center gap-4">
                        <div class="w-14 h-14 bg-emerald-50 dark:bg-slate-800 rounded-2xl flex items-center justify-center overflow-hidden border border-emerald-100 dark:border-slate-700">
                            <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Budi" alt="">
                        </div>
                        <div>
                            <h3 class="text-sm font-black text-slate-800 dark:text-white uppercase tracking-tight">Budi Sudono</h3>
                            <p class="text-[9px] text-slate-400 font-bold tracking-widest uppercase italic">XI IPA 2 • 0098225</p>
                        </div>
                    </div>
                </div>
                
                <div class="flex items-center gap-2 mt-4 text-emerald-500">
                    <i class="bi bi-check-circle-fill text-sm"></i>
                    <span class="text-[9px] font-black uppercase tracking-[0.2em]">Sudah Diterbitkan</span>
                </div>
            </div>
        </div>
    </main>

    <!-- Floating Action Button -->
    <div class="fixed bottom-10 left-10 right-10 z-[100]">
        <button class="w-full bg-slate-900 dark:bg-indigo-600 text-white py-5 rounded-[2.5rem] shadow-2xl flex items-center justify-center gap-4 active:scale-95 transition-all border-t border-white/10">
            <div class="w-10 h-10 bg-white/20 rounded-2xl flex items-center justify-center">
                <i class="bi bi-lightning-charge-fill"></i>
            </div>
            <div class="text-left leading-tight">
                <p class="text-[10px] uppercase font-black tracking-widest opacity-80">Power Actions</p>
                <p class="text-xs font-black uppercase tracking-[0.1em]">Terbitkan Semua (15)</p>
            </div>
        </button>
    </div>

</body>
</html>
