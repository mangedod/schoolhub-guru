<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login Guru - Schoolhub Central</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        indigo: {
                            50: '#f0f4ff',
                            100: '#e0e9ff',
                            200: '#c2d3ff',
                            300: '#a3bdff',
                            400: '#85a7ff',
                            500: '#6691ff',
                            600: '#4f46e5',
                            700: '#3730a3',
                            800: '#1e1b4b',
                            900: '#0f172a',
                        },
                    },
                    borderRadius: {
                        '4xl': '2rem',
                    }
                }
            }
        }
    </script>
    <script>
        if (localStorage.getItem("color-theme") === "dark" || (!("color-theme" in localStorage) && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
            document.documentElement.classList.add("dark");
        } else {
            document.documentElement.classList.remove("dark")
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { font-family: "Plus Jakarta Sans", sans-serif; letter-spacing: -0.01em; }
        .glass-card { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.3); }
        .dark .glass-card { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="bg-[#F8FAFC] dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen flex items-center justify-center p-6 pb-12">
    
    <div class="w-full max-w-sm relative">
        <!-- Decorative Background Glow -->
        <div class="absolute -top-20 -left-20 w-40 h-40 bg-indigo-500/10 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-20 -right-20 w-40 h-40 bg-indigo-600/10 rounded-full blur-3xl"></div>

        <div class="text-center mb-10 relative z-10">
            <div class="w-20 h-20 bg-indigo-600 rounded-[2.5rem] flex items-center justify-center text-white mx-auto mb-6 shadow-2xl shadow-indigo-500/40 relative group">
                <i class="bi bi-person-workspace text-3xl"></i>
                <div class="absolute inset-0 bg-white/20 rounded-[2.5rem] scale-0 group-hover:scale-100 transition-transform duration-500"></div>
            </div>
            <h1 class="text-2xl font-black uppercase tracking-tight dark:text-white">EduTeacher</h1>
            <p class="text-[10px] text-indigo-600 dark:text-indigo-400 font-black uppercase tracking-[0.3em] mt-2 italic">Akses Panel Akademik</p>
        </div>

        <div class="glass-card rounded-[3rem] p-8 shadow-2xl relative z-10">
            <form action="index.html" class="space-y-5">
                <div class="space-y-4">
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-5 flex items-center pointer-events-none">
                            <i class="bi bi-person-fill text-slate-400 group-focus-within:text-indigo-600 transition-colors"></i>
                        </div>
                        <input type="text" class="w-full bg-slate-50 dark:bg-slate-950 dark:text-white border-none rounded-2xl pl-12 pr-6 py-4.5 text-sm font-bold focus:ring-2 focus:ring-indigo-600 outline-none transition-all shadow-sm" placeholder="NIP / Username">
                    </div>
                    
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-5 flex items-center pointer-events-none">
                            <i class="bi bi-lock-fill text-slate-400 group-focus-within:text-indigo-600 transition-colors"></i>
                        </div>
                        <input type="password" class="w-full bg-slate-50 dark:bg-slate-950 dark:text-white border-none rounded-2xl pl-12 pr-6 py-4.5 text-sm font-bold focus:ring-2 focus:ring-indigo-600 outline-none transition-all shadow-sm" placeholder="PIN / Password">
                    </div>
                </div>
                
                <button type="submit" class="w-full py-5 bg-indigo-600 text-white rounded-2xl text-[10px] font-black uppercase tracking-[0.2em] shadow-xl shadow-indigo-500/30 active:scale-95 transition-all flex items-center justify-center gap-2">
                    Masuk Sekarang <i class="bi bi-arrow-right"></i>
                </button>
            </form>

            <div class="mt-8 pt-8 border-t border-slate-100 dark:border-slate-800 text-center space-y-6">
                <a href="quick-login.html" class="inline-flex items-center gap-2 text-[10px] font-black uppercase tracking-widest text-indigo-600 dark:text-indigo-400 italic hover:opacity-70 transition-all">
                    <i class="bi bi-fingerprint"></i>
                    Akses Cepat PIN
                </a>
                
                <div class="relative">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-slate-50 dark:border-slate-800"></div>
                    </div>
                    <div class="relative flex justify-center text-[8px]">
                        <span class="px-4 bg-white dark:bg-slate-900 text-slate-400 font-black uppercase tracking-widest">Atau</span>
                    </div>
                </div>

                <a href="register-init.html" class="block w-full py-4 rounded-2xl border-2 border-slate-50 dark:border-slate-800 text-[9px] font-black uppercase tracking-widest text-slate-500 dark:text-slate-400 active:scale-95 transition-all">
                    Aktivasi Akun Baru
                </a>
                
                <p class="text-[9px] text-slate-400 font-medium italic leading-relaxed">Hubungi tata usaha bila NIP belum terdaftar di sistem pusat.</p>
            </div>
        </div>

        <p class="mt-10 text-center text-[9px] font-black text-slate-300 uppercase tracking-[0.4em]">Schoolhub Central v4.0</p>
    </div>

</body>
</html>
