<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Profil Guru - Schoolhub Central</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        indigo: {
                            50: '#f0f4ff',
                            100: '#e0e9ff',
                            200: '#c2d3ff',
                            300: '#a3bdff',
                            400: '#85a7ff',
                            500: '#6691ff',
                            600: '#4f46e5',
                            700: '#3730a3',
                            800: '#1e1b4b',
                            900: '#0f172a',
                        },
                    },
                    borderRadius: {
                        '4xl': '2rem',
                    }
                }
            }
        }
    </script>
    <script>
        if (localStorage.getItem("color-theme") === "dark" || (!("color-theme" in localStorage) && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
            document.documentElement.classList.add("dark");
        } else {
            document.documentElement.classList.remove("dark")
        }
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        [x-cloak] { display: none !important; }
        body { font-family: "Plus Jakarta Sans", sans-serif; letter-spacing: -0.01em; }
        .glass-card { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.3); }
        .dark .glass-card { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="bg-[#F8FAFC] dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen pb-32">

    <!-- Top Header -->
    <header class="px-6 py-6 flex items-center justify-between sticky top-0 z-40 bg-[#F8FAFC]/80 dark:bg-slate-950/80 backdrop-blur-lg">
        <div class="flex items-center gap-4">
            <a href="index.html" class="w-10 h-10 glass-card rounded-2xl flex items-center justify-center text-slate-600 dark:text-slate-400">
                <i class="bi bi-arrow-left"></i>
            </a>
            <h1 class="text-sm font-black text-slate-900 dark:text-white uppercase tracking-tight">Profil Saya</h1>
        </div>
        <button class="w-10 h-10 glass-card rounded-2xl flex items-center justify-center text-slate-400">
            <i class="bi bi-gear-fill"></i>
        </button>
    </header>

    <main class="px-6 space-y-8">
        <!-- Profile Hero -->
        <div class="relative">
            <div class="bg-indigo-600 rounded-[3rem] p-8 text-white shadow-2xl shadow-indigo-500/20 overflow-hidden">
                <!-- Decorative Gradients -->
                <div class="absolute top-0 right-0 w-32 h-32 bg-white/10 rounded-full -mr-16 -mt-16 blur-2xl"></div>
                <div class="absolute bottom-0 left-0 w-24 h-24 bg-indigo-400/20 rounded-full -ml-12 -mb-12 blur-xl"></div>
                
                <div class="relative z-10 flex flex-col items-center text-center">
                    <div class="relative group">
                        <div class="w-28 h-28 bg-white/20 p-1 rounded-[2.5rem] backdrop-blur-md border border-white/30 transition-transform duration-500 group-hover:scale-105">
                            <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Budi" class="w-full h-full rounded-[2.2rem] bg-indigo-50" alt="">
                        </div>
                        <button class="absolute bottom-0 right-0 w-8 h-8 bg-white text-indigo-600 rounded-xl flex items-center justify-center shadow-lg active:scale-90">
                            <i class="bi bi-camera-fill text-xs"></i>
                        </button>
                    </div>
                    
                    <h2 class="mt-4 text-xl font-black uppercase tracking-tight">Budi Santoso, S.Pd</h2>
                    <p class="text-[10px] text-indigo-200 font-black uppercase tracking-[0.2em] mt-1">NIP: 198801021992031002</p>
                    
                    <div class="mt-4 flex items-center gap-2 px-4 py-1.5 bg-white/10 rounded-full backdrop-blur-sm border border-white/10">
                        <i class="bi bi-award-fill text-xs text-yellow-400"></i>
                        <span class="text-[9px] font-black uppercase tracking-wider">Wali Kelas XI - IPA 2</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Career Info Grid -->
        <div class="grid grid-cols-2 gap-4">
            <div class="glass-card rounded-[2.5rem] p-5 text-center">
                <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1">Masa Kerja</p>
                <p class="text-sm font-black text-slate-800 dark:text-white">12 Tahun</p>
            </div>
            <div class="glass-card rounded-[2.5rem] p-5 text-center">
                <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1">Sertifikasi</p>
                <p class="text-sm font-black text-emerald-500 uppercase">Aktif</p>
            </div>
        </div>

        <!-- Settings List -->
        <div class="space-y-4">
            <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest pl-4">Pengaturan Akun</h3>
            
            <div class="space-y-3">
                <button class="w-full flex items-center justify-between p-5 bg-white dark:bg-slate-900 rounded-[2rem] border border-slate-100 dark:border-slate-800 shadow-sm active:scale-95 transition-all group">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 bg-indigo-50 dark:bg-indigo-900/30 text-indigo-600 dark:text-indigo-400 rounded-2xl flex items-center justify-center group-hover:bg-indigo-600 group-hover:text-white transition-colors">
                            <i class="bi bi-person-badge text-xl"></i>
                        </div>
                        <div class="text-left">
                            <p class="text-sm font-black text-slate-800 dark:text-white uppercase tracking-tight">Data Kepegawaian</p>
                            <p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Detail NIP, Pangkat, Jabatan</p>
                        </div>
                    </div>
                    <i class="bi bi-chevron-right text-slate-300"></i>
                </button>

                <button class="w-full flex items-center justify-between p-5 bg-white dark:bg-slate-900 rounded-[2rem] border border-slate-100 dark:border-slate-800 shadow-sm active:scale-95 transition-all group">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 bg-emerald-50 dark:bg-emerald-900/30 text-emerald-600 dark:text-emerald-400 rounded-2xl flex items-center justify-center group-hover:bg-emerald-600 group-hover:text-white transition-colors">
                            <i class="bi bi-shield-lock text-xl"></i>
                        </div>
                        <div class="text-left">
                            <p class="text-sm font-black text-slate-800 dark:text-white uppercase tracking-tight">Keamanan</p>
                            <p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Sandi, 2FA, Riwayat Login</p>
                        </div>
                    </div>
                    <i class="bi bi-chevron-right text-slate-300"></i>
                </button>

                <a href="../index.html" class="w-full flex items-center justify-between p-5 bg-rose-50 dark:bg-rose-900/10 rounded-[2rem] border border-rose-100 dark:border-rose-900/20 shadow-sm active:scale-95 transition-all group">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 bg-rose-100 dark:bg-rose-900/30 text-rose-600 dark:text-rose-400 rounded-2xl flex items-center justify-center group-hover:bg-rose-600 group-hover:text-white transition-colors">
                            <i class="bi bi-box-arrow-right text-xl"></i>
                        </div>
                        <div class="text-left">
                            <p class="text-sm font-black text-rose-600 dark:text-rose-400 uppercase tracking-tight">Keluar Sistem</p>
                            <p class="text-[10px] text-rose-400 font-bold uppercase tracking-wider italic">Sesi Anda Akan Berakhir</p>
                        </div>
                    </div>
                </a>
            </div>
        </div>

        <!-- App Metadata -->
        <div class="text-center pb-8">
            <p class="text-[9px] font-black text-slate-300 uppercase tracking-[0.4em]">Schoolhub Central v4.0.2</p>
        </div>
    </main>

    <!-- Floating Navigation -->
    <div class="fixed bottom-6 left-6 right-6 z-[100]">
        <nav class="bg-white/80 dark:bg-slate-900/80 backdrop-blur-lg border border-white/20 dark:border-white/5 rounded-[2.5rem] p-4 flex justify-between items-center shadow-2xl">
            <a href="index.html" class="w-12 h-12 flex items-center justify-center text-slate-400 hover:text-indigo-600 transition-colors">
                <i class="bi bi-grid text-xl"></i>
            </a>
            <a href="grading.html" class="w-12 h-12 flex items-center justify-center text-slate-400 hover:text-indigo-600 transition-colors">
                <i class="bi bi-journal-check text-xl"></i>
            </a>
            <a href="chat.html" class="w-12 h-12 flex items-center justify-center text-slate-400 hover:text-indigo-600 transition-colors">
                <i class="bi bi-chat-dots text-xl"></i>
            </a>
            <a href="profile.html" class="w-12 h-12 flex items-center justify-center bg-indigo-600 rounded-2xl text-white shadow-lg shadow-indigo-500/30 scale-110">
                <i class="bi bi-person-fill text-xl"></i>
            </a>
        </nav>
    </div>

</body>
</html>
